<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biblioteca NOM · Sierra Madre</title><link rel="icon" href="/assets/sierra-madre.png"><link rel="stylesheet" href="/supervisor.css"><link rel="stylesheet" href="/workspace.css"><link rel="stylesheet" href="/brand.css"><link rel="stylesheet" href="/phase3.css"><style>
.nom-layout{display:grid;grid-template-columns:320px 1fr;gap:18px;min-height:70vh;}
.nom-list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card,12px);padding:14px;overflow:auto;max-height:80vh;}
.nom-search{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface-soft);color:var(--ink);font-size:12px;margin-bottom:10px;}
.nom-item{padding:10px 12px;border-radius:8px;cursor:pointer;margin-bottom:6px;border:1px solid transparent;transition:background .15s,border-color .15s;}
.nom-item:hover{background:var(--surface-soft);}
.nom-item.active{background:var(--accent-soft,#f4ecd9);border-color:var(--gold,#ba9343);}
.nom-item .nom-id{font-size:11px;font-weight:700;color:var(--accent-text,#8c6b2c);}
.nom-item .nom-name{font-size:12px;color:var(--ink);margin-top:2px;}
.nom-item .nom-cat{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:4px;}
.nom-detail{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card,12px);padding:22px;overflow:auto;max-height:80vh;}
.nom-detail h2{font-size:18px;margin:0 0 6px;color:var(--ink);}
.nom-detail .nom-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin:14px 0;font-size:12px;}
.nom-detail .nom-meta dt{color:var(--muted);font-weight:700;font-size:10px;letter-spacing:.1em;text-transform:uppercase;}
.nom-detail .nom-meta dd{color:var(--ink);margin:0;}
.nom-detail .nom-status{display:inline-block;padding:3px 9px;border-radius:999px;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:#d9a44118;color:#9a6f12;}
.nom-detail .nom-source{font-size:11px;color:var(--muted);margin-top:14px;}
.nom-detail .nom-source a{color:var(--accent-text,#8c6b2c);}
.nom-empty{text-align:center;padding:40px;color:var(--muted);}
@media(max-width:800px){.nom-layout{grid-template-columns:1fr;}.nom-list{max-height:40vh;}.nom-detail{max-height:none;}}
</style></head><body>
<div class="preview-wrap" style="padding:20px;">
  <header style="position:relative;border-radius:10px;margin-bottom:18px;">
    <div>Seguridad operativa <span>/</span> <b>Biblioteca NOM</b></div>
    <div class="header-tools">
      <a class="sign-out" href="/index.html">← Volver al portal</a>
    </div>
  </header>
  <div class="nom-layout">
    <div class="nom-list">
      <input class="nom-search" id="nomSearch" placeholder="Buscar por número, nombre, palabra clave…" />
      <div id="nomList"></div>
    </div>
    <div class="nom-detail" id="nomDetail">
      <div class="nom-empty">Selecciona una norma de la lista para ver su ficha técnica.</div>
    </div>
  </div>
</div>
<script src="/nom-data.js"></script>
<script>
(function(){
  const lib = window.NOM_LIBRARY || [];
  const listEl = document.getElementById('nomList');
  const detailEl = document.getElementById('nomDetail');
  const searchEl = document.getElementById('nomSearch');
  let selected = null;

  function renderList(q){
    q = (q||'').trim();
    const items = q ? window.searchNOM(q) : lib;
    if (!items.length){ listEl.innerHTML = '<div class="nom-empty">Sin resultados.</div>'; return; }
    listEl.innerHTML = items.map(n =>
      '<div class="nom-item'+(selected===n.id?' active':'')+'" data-id="'+n.id+'">'+
        '<div class="nom-id">'+n.id+'</div>'+
        '<div class="nom-name">'+n.name+'</div>'+
        '<div class="nom-cat">'+n.categoria+' · '+n.tema+'</div>'+
      '</div>'
    ).join('');
    listEl.querySelectorAll('.nom-item').forEach(el => {
      el.addEventListener('click', function(){ showDetail(el.dataset.id); });
    });
  }

  function showDetail(id){
    selected = id;
    const n = lib.find(x => x.id === id);
    if (!n){ detailEl.innerHTML = '<div class="nom-empty">Norma no encontrada.</div>'; return; }
    detailEl.innerHTML =
      '<h2>'+n.id+'</h2>'+
      '<p style="color:var(--muted);font-size:13px;margin:0 0 12px;">'+n.name+'</p>'+
      '<span class="nom-status">'+n.estado+'</span>'+
      '<dl class="nom-meta">'+
        '<dt>Categoría</dt><dd>'+n.categoria+'</dd>'+
        '<dt>Tema</dt><dd>'+n.tema+'</dd>'+
        '<dt>Identificador</dt><dd>'+n.id+'</dd>'+
        '<dt>Palabras clave</dt><dd>'+(n.palabras||[]).join(', ')+'</dd>'+
      '</dl>'+
      '<div class="nom-source">Fuente oficial: <a href="'+n.fuente+'" target="_blank" rel="noopener">Consultar en STPS</a><br>'+
      '<small>Verificar versión, vigencia y contenido contra la fuente oficial antes de considerar vigente.</small></div>';
    renderList(searchEl.value);
  }

  searchEl.addEventListener('input', function(){ renderList(searchEl.value); });
  renderList('');
})();
</script></body></html>
